<head>

  <title>Spelling Land — fun spelling games from TK to 5th grade (plus GRE)</title>
  <meta name="description" content="Learn to spell with fun mini-games — from TK and Kindergarten through 5th grade, plus GRE vocabulary. Free, no ads, no login.">
  <meta property="og:title" content="Spelling Land">
  <meta property="og:description" content="Fun spelling games from TK to 5th grade, plus GRE. Listen, type, pop balloons, and collect badges!">
  <meta name="theme-color" content="#CDE9FF">

<body>
  <div id="scene" aria-hidden="true">
    <div class="puff" style="width:150px;height:44px;top:9%;animation-duration:70s;animation-delay:-12s"></div>

    <div class="puff" style="width:180px;height:52px;top:36%;animation-duration:120s;animation-delay:-35s"></div>
    <div class="puff" style="width:90px;height:26px;top:52%;animation-duration:85s;animation-delay:-5s"></div>
    <span class="twinkle" style="top:8%;left:12%">✦</span><span class="twinkle" style="top:16%;left:82%;animation-delay:-1.2s">✦</span>
    <span class="twinkle" style="top:30%;left:64%;animation-delay:-2.1s">✧</span><span class="twinkle" style="top:42%;left:6%;animation-delay:-.6s">✧</span>
    <svg class="hills" viewBox="0 0 1440 260" preserveAspectRatio="none">

      <g fill="#FFC83D"><circle cx="560" cy="232" r="4"/><circle cx="1360" cy="230" r="5"/></g>
    </svg>
  </div>
  <div id="app"></div>
